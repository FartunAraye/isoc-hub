<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Islamic Society Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%23f4f0e6'/%3E%3Cpath d='M30 10a15 15 0 1 0 0 28 12 12 0 1 1 0-28z' fill='%238f6f38'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="hero-bg.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite + clip shapes. Every <use href="#i-..."> in app.js pulls an icon from here. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <!-- Two-centred pointed arch, in objectBoundingBox units so it scales with whatever element uses it -->
  <clipPath id="arch-clip" clipPathUnits="objectBoundingBox">
    <path d="M0,1 L0,0.56 C0,0.22 0.2,0 0.5,0 C0.8,0 1,0.22 1,0.56 L1,1 Z"/>
  </clipPath>

  <symbol id="i-crescent" viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 0 18 7.2 7.2 0 1 1 0-18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5c2.5-1.3 5.2-1.3 8 0v13c-2.8-1.3-5.5-1.3-8 0zM20 5.5c-2.5-1.3-5.2-1.3-8 0v13c2.8-1.3 5.5-1.3 8 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.6 7.2L22 12l-7.4 2.8L12 22l-2.6-7.2L2 12l7.4-2.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-lantern" viewBox="0 0 24 24"><path d="M9 4h6M12 4v3M8 7h8l2 3v6a5 5 0 0 1-10 0v-6zM7 12h10M12 20v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 9a4.8 4.8 0 0 1 8.5-3 4.8 4.8 0 0 1 8.5 3c0 6-8.5 11.5-8.5 11.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 3h16zM10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.6 7-11.8A7 7 0 0 0 5 9.2C5 14.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="9.2" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 10h16M8 3.5v4M16 3.5v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m4.5 6.5 7.5 6 7.5-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
</defs>
</svg>

<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<p id="toast" role="status" aria-live="polite" hidden></p>

<script type="module" src="app.js"></script>
</body>
</html>
